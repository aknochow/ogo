name: E2E Tests (MicroShift Native)

# EXPERIMENTAL / EVALUATION WORKFLOW — see .github/workflows/test-e2e.yml for
# the current required "E2E on MINC" check. This workflow is a parallel,
# non-required candidate replacement being evaluated because MINC (nested
# MicroShift-in-podman) started failing on the ubuntu-24.04 runner image
# after it bumped Podman 4.9.3 -> 5.8.4: the outer podman now defaults to
# networkBackend=netavark/cgroupManager=cgroupfs, which clashes with the
# inner MicroShift/CRI-O's networkBackend=cni/cgroupManager=systemd, and
# kube-kindnet/kube-proxy DaemonSet pods fail with CreateContainerError.
# Bumping crun and forcing cgroup_manager=systemd via a podman
# containers.conf.d drop-in did NOT fix it (see branch history).
#
# This workflow sidesteps that whole bug class by installing MicroShift
# natively on the runner via the microshift-io/microshift community project
# (https://github.com/microshift-io/microshift) — it builds real
# openshift/microshift sources against OKD payload images (no Red Hat
# subscription/pull secret needed) and ships a DEB package for Ubuntu that
# runs MicroShift as a plain systemd service directly on the host. There is
# no nested container layer, so there is no inner/outer podman to disagree
# about cgroups or networking.
#
# Trade-off: per microshift-io's own OS support matrix, Ubuntu is Kindnet-only
# (no OVN-Kubernetes) and has no Greenboot. This is NOT expected to matter for
# what this job actually exercises: the "Manager" e2e suite (test/e2e/e2e_test.go)
# only creates a namespace, installs the OpenShellGateway CRD, deploys the
# controller-manager, and checks the metrics endpoint — it never touches
# route.openshift.io, SecurityContextConstraints, or oauth.openshift.io/
# user.openshift.io. Those OpenShift-only paths live in
# test/e2e/e2e_real_cluster_test.go's "RealCluster" suite, which is already
# gated on hasOpenShiftOAuthAPI() and only runs against a real OpenShift
# cluster (make test-e2e-real) — unaffected either way by this workflow.
#
# NOT verified in real CI yet — see the summary in the PR/handoff for a list
# of assumptions (CRI-O apt repo on Ubuntu 24.04 "noble", the local-registry
# image-load path, microshift-selinux .deb behavior on a non-SELinux distro)
# that need confirmation on an actual run.

on:
  workflow_dispatch:
  pull_request:
    # Scoped to changes to this workflow file itself so iterating on it gets
    # fast feedback, without doubling CI cost/time on every unrelated PR
    # while this is still unproven. Broaden (e.g. to match test-e2e.yml's
    # push/pull_request-on-main triggers) once validated.
    paths:
      - ".github/workflows/test-e2e-microshift-native.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMG: quay.io/aknochow/ogo:e2e-test
  # Separate reference for the in-cluster pull path: the operator image is
  # built with `docker build` (into the Docker daemon's own storage, which
  # CRI-O does not share), then pushed to a throwaway local registry so
  # CRI-O can pull it like any other image. See "Load image into MicroShift"
  # below for why this route was chosen over relying on shared
  # containers-storage between docker/podman and CRI-O.
  CLUSTER_IMG: localhost:5000/ogo:e2e-test
  MICROSHIFT_DEBS_ASSET: microshift-debs-x86_64.tgz

jobs:
  test-e2e:
    name: E2E on MicroShift (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUBECONFIG: /home/runner/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Environment fingerprint (compare against local repro)
        # A local Ubuntu 24.04 VM (Lima, aarch64) reproduced the same
        # install.sh + MicroShift + docker setup and did NOT hit the DNS
        # resolution failure seen here -- ip_forward and docker's
        # DOCKER-USER/DOCKER-FORWARD chain insertion were both ruled out as
        # the cause by direct testing. Dumping the same fingerprint here so
        # the two environments can be diffed directly instead of guessing
        # at what's different (arch, iptables backend, kernel config,
        # package versions, etc.).
        run: |
          echo "=== uname ==="; uname -a
          echo "=== iptables version/backend ==="; sudo iptables --version; sudo update-alternatives --display iptables 2>&1 | head -5
          echo "=== nft vs legacy ==="; which iptables-nft iptables-legacy 2>&1
          echo "=== docker version ==="; docker version --format '{{.Server.Version}}' 2>&1
          echo "=== network interfaces ==="; ip addr show | grep -E '^[0-9]+:'
          echo "=== ufw status ==="; sudo ufw status verbose 2>&1 || echo "ufw not installed/active yet"
          echo "=== relevant sysctls ==="
          sysctl net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables 2>&1 || true
          echo "=== kernel modules (full) ==="; lsmod | sort

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h

      - name: Checkout microshift-io/microshift (for src/deb/install.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microshift-io/microshift
          ref: main
          path: microshift-io
          persist-credentials: false

      - name: Download prebuilt MicroShift DEB packages
        # microshift-io publishes prebuilt microshift-debs-x86_64.tgz assets on
        # every GitHub Release, so CI can install directly rather than
        # building RPMs (make rpm, needs dnf/podman + a CentOS Stream 9
        # build env) and converting them to DEBs (make rpm-to-deb) from
        # source — that path is documented but far too slow/heavy for a
        # per-PR CI job.
        run: |
          set -euo pipefail
          asset_url=$(curl -sSf https://api.github.com/repos/microshift-io/microshift/releases/latest \
            | jq -r --arg name "${MICROSHIFT_DEBS_ASSET}" '.assets[] | select(.name == $name) | .browser_download_url')
          if [ -z "${asset_url}" ]; then
            echo "Could not find ${MICROSHIFT_DEBS_ASSET} on the latest microshift-io/microshift release" >&2
            exit 1
          fi
          echo "Downloading ${asset_url}"
          mkdir -p /tmp/microshift-debs
          curl -LsSf -o /tmp/microshift-debs.tgz "${asset_url}"
          tar -xzf /tmp/microshift-debs.tgz -C /tmp/microshift-debs
          ls -la /tmp/microshift-debs

      - name: Install MicroShift (DEB, native — no nested containers)
        working-directory: microshift-io
        run: |
          sudo ./src/deb/install.sh /tmp/microshift-debs

      - name: Ensure only the Kindnet CNI config is active
        # Known issue on GitHub Actions runners specifically (matching this
        # exact environment class, "runnervm*" hostnames): both podman and
        # crio are present, and podman's own default bridge CNI conflist can
        # get (re-)written to /etc/cni/net.d after install.sh's own
        # install_crio() already disabled whatever was there at install
        # time. CRI-O then picks up the wrong network for some pods --
        # matches microshift-io/microshift#95 exactly, root cause of a
        # "Could not resolve host ...svc.cluster.local" DNS failure seen on
        # the first real test run of this workflow (pod-to-service traffic
        # silently went out on the wrong bridge). Reapply the same
        # disable-non-kindnet-conflists step install.sh does, right before
        # MicroShift actually starts scheduling pods, as a second pass.
        run: |
          echo "=== /etc/cni/net.d before cleanup ==="
          ls -la /etc/cni/net.d/ || true
          find /etc/cni/net.d -name '*.conflist' ! -name '*kindnet*' -print 2>/dev/null | while read -r cl; do
            echo "Disabling non-kindnet CNI config: ${cl}"
            sudo mv "${cl}" "${cl}.disabled"
          done
          echo "=== /etc/cni/net.d after cleanup ==="
          ls -la /etc/cni/net.d/ || true

      - name: Start MicroShift service
        run: |
          sudo systemctl start microshift.service
          sudo systemctl status microshift.service --no-pager || true

      - name: Setup kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          for i in $(seq 1 60); do
            if sudo test -f /var/lib/microshift/resources/kubeadmin/kubeconfig; then
              break
            fi
            echo "Waiting for kubeconfig to be generated... ($i/60)"
            sleep 5
          done
          sudo cat /var/lib/microshift/resources/kubeadmin/kubeconfig > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Wait for cluster ready
        run: |
          echo "Waiting for nodes..."
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

          echo "Waiting for system pods..."
          kubectl get pods -A
          echo "Cluster is ready"

      - name: Diagnose MicroShift failure
        if: failure()
        run: |
          # All commands here are best-effort diagnostic aids - `|| true`
          # prevents any single missing tool or command from cutting the
          # diagnostic dump short.
          echo "=== systemctl status crio ==="
          sudo systemctl status crio --no-pager || true
          echo "=== systemctl status microshift ==="
          sudo systemctl status microshift --no-pager || true
          echo "=== journalctl -u microshift (tail) ==="
          sudo journalctl -u microshift --no-pager | tail -300 || true
          echo "=== journalctl -u crio (tail) ==="
          sudo journalctl -u crio --no-pager | tail -200 || true
          echo "=== crictl ps -a ==="
          sudo crictl ps -a || true
          echo "=== crictl images ==="
          sudo crictl images || true
          echo "=== kubectl get pods -A ==="
          kubectl get pods -A || true
          echo "=== kubectl describe nodes ==="
          kubectl describe nodes || true
          echo "=== ip addr ==="
          ip addr || true
          echo "=== iptables-save ==="
          sudo iptables-save || true

      - name: DNS smoke test (fail fast, before building/loading any image)
        # Isolates basic cluster Service-DNS resolution from anything
        # OGO-specific and, deliberately, from docker/the operator image
        # entirely: this runs before Setup Go/Build operator image/Load
        # image so a networking regression fails in seconds and skips the
        # most expensive remaining steps, instead of failing ~5 minutes in
        # via the ginkgo suite's metrics test after already paying for a
        # full image build. Temporary ordering while the native-MicroShift
        # path is unproven -- revert to running this closer to the e2e
        # suite once it's reliable, since checking DNS this early also
        # means it's not (yet) exercising the post-docker environment the
        # real test run will use.
        #
        # "Wait for cluster ready" above only waits on node Ready, which
        # says nothing about whether the openshift-dns DaemonSet has
        # actually scheduled/started its pod yet -- moving this check
        # earlier surfaced that race directly (dns-default sitting at
        # ContainerCreating with zero Service endpoints), so wait on the
        # DNS pod specifically before probing it.
        run: |
          echo "Waiting for openshift-dns pod to be Ready..."
          kubectl wait --for=condition=Ready pod \
            -n openshift-dns -l dns.operator.openshift.io/daemonset-dns=default \
            --timeout=120s

          kubectl run dns-smoke-test --image=busybox:1.36 --restart=Never -- sleep 300
          kubectl wait --for=condition=Ready pod/dns-smoke-test --timeout=60s
          kubectl exec dns-smoke-test -- nslookup kubernetes.default.svc.cluster.local
          kubectl delete pod dns-smoke-test --now

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build operator image
        run: docker build -f Containerfile -t ${{ env.IMG }} .

      - name: Load image into MicroShift
        # Native MicroShift's runtime is CRI-O, not podman, so the
        # `podman cp ... exec podman load` dance the MINC workflow used
        # (loading into a nested podman inside the microshift container)
        # doesn't apply here — there's no nested container to copy into.
        #
        # This uses a throwaway local insecure registry as the hand-off
        # point: it's the most portable option since it doesn't assume
        # docker (which builds the image) and CRI-O share the same
        # containers-storage graph root, which is NOT guaranteed on Ubuntu
        # even though both are built on the containers/storage library.
        #
        # UNVERIFIED alternative worth trying if this proves flaky: build
        # with `podman build` instead of `docker build`, and if CRI-O's
        # storage.conf happens to point at the same graph root podman uses
        # (/var/lib/containers/storage), the image may already be visible
        # to CRI-O with no push step at all. Not used here as the default
        # because that storage-root alignment isn't documented by
        # microshift-io and would need to be confirmed on a real runner.
        run: |
          set -euo pipefail
          docker run -d --name local-registry -p 5000:5000 registry:2

          echo "Waiting for local registry to come up..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ >/dev/null; then
              break
            fi
            sleep 1
          done

          docker tag ${{ env.IMG }} ${{ env.CLUSTER_IMG }}
          docker push ${{ env.CLUSTER_IMG }}

          echo "Configuring CRI-O to trust the local insecure registry..."
          sudo mkdir -p /etc/containers/registries.conf.d
          cat <<'EOF' | sudo tee /etc/containers/registries.conf.d/999-local-registry.conf
          [[registry]]
          location = "localhost:5000"
          insecure = true
          EOF

          # Re-check for a stray podman CNI conflist here too, not just
          # before MicroShift starts: this is the step that first invokes
          # docker (the local registry container), and microshift-io/
          # microshift#95's failure mode is podman's default bridge conflist
          # reappearing in /etc/cni/net.d after something touches container
          # networking on the host -- pods created AFTER that point pick up
          # the wrong network. Piggyback on the crio restart already needed
          # below for the registry config, rather than restarting twice.
          echo "=== /etc/cni/net.d before second cleanup pass ==="
          ls -la /etc/cni/net.d/ || true
          find /etc/cni/net.d -name '*.conflist' ! -name '*kindnet*' -print 2>/dev/null | while read -r cl; do
            echo "Disabling non-kindnet CNI config: ${cl}"
            sudo mv "${cl}" "${cl}.disabled"
          done

          sudo systemctl restart crio

          # Restarting crio briefly drops the kubelet's CRI connection; give
          # MicroShift a moment to reconcile before handing off to the tests.
          sleep 10
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Environment fingerprint (post-MicroShift+docker)
        # Same fingerprint as the job-start one, captured again now that
        # MicroShift and docker are both actually running -- the local VM
        # repro that worked was checked at this exact point (after `docker
        # run` for the registry), not at job start.
        run: |
          echo "=== iptables FORWARD chain ==="; sudo iptables -L FORWARD -n
          echo "=== relevant sysctls ==="
          sysctl net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables 2>&1 || true
          echo "=== dns-default Service/Endpoints ==="
          kubectl get svc,endpoints -n openshift-dns 2>&1

      - name: Run e2e tests
        run: |
          SKIP_BUILD=true CERT_MANAGER_INSTALL_SKIP=true IMG=${{ env.CLUSTER_IMG }} \
            go test ./test/e2e/ -v -ginkgo.v -timeout 10m

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator Logs ==="
          kubectl logs -n ogo -l control-plane=controller-manager \
            -c manager --tail=100 2>/dev/null || true

          echo ""
          echo "=== Events ==="
          kubectl get events -n ogo --sort-by='.lastTimestamp' 2>/dev/null \
            | tail -30 || true

          echo ""
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true

          echo ""
          echo "=== /etc/cni/net.d (active vs disabled) ==="
          ls -la /etc/cni/net.d/ || true

          echo ""
          echo "=== DNS Service and endpoints (openshift-dns) ==="
          kubectl get svc,endpoints -n openshift-dns 2>/dev/null || true

          echo ""
          echo "=== CoreDNS/dns-default logs ==="
          kubectl logs -n openshift-dns -l dns.operator.openshift.io/daemonset-dns=default \
            -c dns --tail=100 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f local-registry || true
          sudo systemctl stop microshift.service || true
          echo y | sudo microshift-cleanup-data --all || true
          sudo apt purge -y 'microshift*' || true
