name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMG: quay.io/aknochow/ogo:e2e-test

jobs:
  test-e2e:
    name: E2E on MINC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG: /home/runner/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Upgrade crun
        # Root cause of the intermittent "error creating cluster" err="exit
        # status 125" failures: Podman >=5.x emits OCI runtime-spec v1.2.1,
        # but crun <1.14.3 has a version-parsing bug that rejects it with
        # "crun: unknown version specified" (only surfaced once minc's debug
        # logging was enabled below — minc itself swallows the real error).
        # Affects Ubuntu 24.04 runner images that haven't picked up a fixed
        # crun package yet; overwrite the system binary directly rather than
        # relying on PATH order, since podman may reference it by absolute
        # path.
        env:
          CRUN_VERSION: "1.28"
          # Computed locally via: curl -sL <release-url> | sha256sum
          # (crun doesn't publish a plain sha256sums file, only per-asset
          # GPG .asc signatures) — re-verify against the .asc signature at
          # https://github.com/containers/crun/releases/tag/1.28 before
          # bumping this value.
          CRUN_SHA256: 2aa6b7024a9c9f153895c0d11ae233d3758f54844011c3a039e3e89048d01d42
        run: |
          curl -LsSf -o /tmp/crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64"
          echo "${CRUN_SHA256}  /tmp/crun" | sha256sum -c -
          chmod +x /tmp/crun
          sudo cp /tmp/crun "$(command -v crun)"
          crun --version

      - name: Build operator image
        run: docker build -f Containerfile -t ${{ env.IMG }} .

      - name: Install MINC
        env:
          MINC_VERSION: v0.1.0
          MINC_SHA256: 1acdf74755b1da09d8c773a4c0f7f651a1bbca9e6263c533ab11fe029371bb77
        run: |
          curl -LsSf -o /tmp/minc \
            "https://github.com/minc-org/minc/releases/download/${MINC_VERSION}/minc_linux_amd64"
          echo "${MINC_SHA256}  /tmp/minc" | sha256sum -c -
          chmod +x /tmp/minc
          sudo mv /tmp/minc /usr/local/bin/minc
          minc version

      - name: Create MINC cluster
        run: |
          # Best-effort: this step runs under `bash -e`, so `|| true` is
          # required here, not just tolerated — without it, a future minc
          # version dropping/renaming this subcommand would abort the whole
          # step before `minc create` is even attempted, failing CI in a new
          # way every time this purely-diagnostic aid breaks.
          sudo minc config set log-level debug || true
          # This is the actual required step - if minc itself is missing or
          # broken, this fails loudly and clearly, unlike the line above.
          sudo minc create
          echo "Waiting for cluster to be ready..."
          sudo minc status

      - name: Diagnose MINC failure
        if: failure()
        run: |
          # All commands here are best-effort diagnostic aids - `|| true`
          # prevents any single missing tool or command from cutting the
          # diagnostic dump short.
          echo "=== podman info ==="
          sudo podman info || true
          echo "=== podman ps -a ==="
          sudo podman ps -a || true
          echo "=== podman version ==="
          sudo podman version || true
          echo "=== kernel/cgroup ==="
          uname -a
          cat /sys/fs/cgroup/cgroup.controllers 2>&1 || echo "no unified cgroup.controllers file"
          mount | grep cgroup
          echo "=== journalctl tail ==="
          sudo journalctl -xe --no-pager | tail -200 || true
          echo "=== dmesg tail ==="
          sudo dmesg | tail -100 || true

      - name: Setup kubeconfig
        run: |
          sudo minc generate-kubeconfig
          mkdir -p "$HOME/.kube"
          sudo cp /root/.kube/config "$HOME/.kube/config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"

      - name: Wait for cluster ready
        run: |
          echo "Waiting for nodes..."
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

          echo "Waiting for system pods..."
          kubectl get pods -A
          echo "Cluster is ready"

      - name: Load image into MINC
        run: |
          docker save ${{ env.IMG }} -o /tmp/ogo-image.tar
          sudo podman cp /tmp/ogo-image.tar microshift:/tmp/ogo-image.tar
          sudo podman exec microshift podman load -i /tmp/ogo-image.tar
          rm -f /tmp/ogo-image.tar

      - name: Run e2e tests
        run: |
          SKIP_BUILD=true CERT_MANAGER_INSTALL_SKIP=true IMG=${{ env.IMG }} \
            go test ./test/e2e/ -v -ginkgo.v -timeout 10m

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator Logs ==="
          kubectl logs -n ogo -l control-plane=controller-manager \
            -c manager --tail=100 2>/dev/null || true

          echo ""
          echo "=== Events ==="
          kubectl get events -n ogo --sort-by='.lastTimestamp' 2>/dev/null \
            | tail -30 || true

          echo ""
          echo "=== All Pods ==="
          kubectl get pods -A 2>/dev/null || true

          echo ""
          echo "=== crictl-level detail (all pods/containers) ==="
          # kubectl only ever shows the K8s-level "CreateContainerError"
          # status, not the underlying CRI-O/OCI runtime error that caused
          # it -- crictl inspect (run inside the microshift container,
          # since that's where CRI-O actually lives) surfaces the real
          # message. Listing everything rather than filtering by name,
          # since a pod's K8s name isn't the same as its container name
          # inside CRI-O (a --name filter on the wrong value silently
          # matches nothing).
          echo "--- crictl pods -a (sandbox-level) ---"
          sudo podman exec microshift crictl pods -a 2>&1 || true
          echo "--- crictl ps -a (container-level) ---"
          sudo podman exec microshift crictl ps -a 2>&1 || true
          for cid in $(sudo podman exec microshift crictl ps -a -q 2>/dev/null); do
            echo "--- inspect $cid ---"
            sudo podman exec microshift crictl inspect "$cid" 2>&1 | head -100 || true
          done

          echo ""
          echo "=== podman info (outer host) ==="
          sudo podman info 2>&1 || true

          echo ""
          echo "=== podman info (inner microshift container) ==="
          sudo podman exec microshift podman info 2>&1 || true

      - name: Cleanup
        if: always()
        run: sudo minc delete || true
