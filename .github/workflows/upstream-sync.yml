name: Upstream Sync

# Detection of new NVIDIA OpenShell releases is Dependabot's job (see
# .github/dependabot.yml's entry for /hack/openshell-pins) - it opens a PR
# whenever it bumps a tag in hack/openshell-pins/Dockerfile. This workflow
# has two responsibilities:
#
# 1. sync: on that PR, complete the bump by updating the ImageTag
#    kubebuilder default, regenerating CRD manifests, and updating the
#    OpenShell version badge - then push those changes onto the same PR
#    branch so the PR's normal CI (lint/test/e2e) tests the new pin before
#    anyone merges it.
# 2. tag: on merge to main, if the merged commit ONLY touched the
#    dependency-bump files (no other code changes), auto-tag a
#    dependency-only release (vX.Y.Z-N) and push it, which triggers the
#    normal release.yml build pipeline. Deliberate OGO releases (vX.Y.Z)
#    stay a manual, human-triggered action - see AGENTS.md's tag strategy.
#
# Uses pull_request_target (not pull_request) because Dependabot PRs get a
# read-only GITHUB_TOKEN under the normal pull_request trigger, and this
# workflow needs write access to push the sync commit back. Privileged
# work runs against the trusted base checkout only: the PR's pin file is
# fetched as data via the API (never `actions/checkout` of
# pull_request.head.sha, which Scorecard flags as Dangerous-Workflow).
# `make manifests` therefore never runs against untrusted workflow files
# or Makefiles from the PR. The job-level `if:` (github.actor ==
# 'dependabot[bot]' AND the head ref starts with 'dependabot/') is still
# required so a random contributor cannot feed this job a pin file.

on:
  pull_request_target:
    paths:
      - 'hack/openshell-pins/**'
  push:
    branches:
      - main
    paths:
      - 'hack/openshell-pins/**'

permissions:
  contents: read

jobs:
  sync:
    # Restricted to Dependabot's own actor identity AND a dependabot/*
    # branch name, checked here at the job level so neither the pin-file
    # fetch nor `make manifests` (Go tooling) ever runs against anything
    # else. github.actor can't be spoofed by a PR author, unlike file
    # contents - without this, any contributor to this public repo could
    # open a PR touching hack/openshell-pins/** and get this job to run
    # with PAT_TOKEN's write access.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # pull_request_target defaults to the base branch (trusted). Do not
      # pass pull_request.head.sha to actions/checkout — that is the
      # Dangerous-Workflow pattern Scorecard flags, and it would also
      # execute the PR's Makefile/scripts under PAT_TOKEN.
      - name: Checkout base (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch pin file from the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! echo "${HEAD_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "HEAD_SHA is not a 40-char hex SHA - refusing"
            exit 1
          fi
          gh api -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/hack/openshell-pins/Dockerfile?ref=${HEAD_SHA}" \
            > hack/openshell-pins/Dockerfile
          grep -q 'openshell/gateway:' hack/openshell-pins/Dockerfile
          grep -q 'openshell/supervisor:' hack/openshell-pins/Dockerfile

      - name: Extract and validate pinned versions
        id: versions
        run: |
          GATEWAY_TAG=$(grep -oP 'openshell/gateway:\K[0-9]+\.[0-9]+\.[0-9]+' hack/openshell-pins/Dockerfile)
          SUPERVISOR_TAG=$(grep -oP 'openshell/supervisor:\K[0-9]+\.[0-9]+\.[0-9]+' hack/openshell-pins/Dockerfile)
          for TAG in "${GATEWAY_TAG}" "${SUPERVISOR_TAG}"; do
            if ! echo "${TAG}" | grep -qP '^\d+\.\d+\.\d+$'; then
              echo "tag '${TAG}' is not bare semver (X.Y.Z) - refusing to use it in sed/git commands"
              exit 1
            fi
          done
          if [ "${GATEWAY_TAG}" != "${SUPERVISOR_TAG}" ]; then
            echo "gateway (${GATEWAY_TAG}) and supervisor (${SUPERVISOR_TAG}) tags diverged - ImageTag is shared, refusing to guess"
            exit 1
          fi
          NEW_VERSION="${GATEWAY_TAG}"
          # Read from the kubebuilder default itself, not the docs.toml badge -
          # that's the actual authoritative pin, and reading it avoids a
          # first-run edge case where the PR head's docs.toml badge already
          # has the new version (this same PR sets it), which would make
          # OLD_VERSION == NEW_VERSION and skip the sync on the very first bump.
          # The (?=") lookahead requires the quoted value to be *entirely*
          # digits/dots - without it, other quoted defaults with a leading
          # digit (e.g. "1Gi", "8h") would also partially match and corrupt
          # OLD_VERSION with extra lines.
          OLD_VERSION=$(grep -oP 'kubebuilder:default="\K\d+\.\d+\.\d+(?=")' api/v1alpha1/openshellgateway_types.go | head -1)
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${NEW_VERSION}" = "${OLD_VERSION}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update source files to the new pinned version
        if: steps.versions.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
          OLD_VERSION: ${{ steps.versions.outputs.old_version }}
        run: |
          sed -i "s/kubebuilder:default=\"${OLD_VERSION}\"/kubebuilder:default=\"${NEW_VERSION}\"/" \
            api/v1alpha1/openshellgateway_types.go
          sed -i "s/OpenShell-v${OLD_VERSION}/OpenShell-v${NEW_VERSION}/g" docs.toml README.md

      - name: Regenerate CRD manifests
        if: steps.versions.outputs.changed == 'true'
        run: make manifests

      - name: Commit and push to PR branch
        if: steps.versions.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if ! echo "${HEAD_REF}" | grep -qP '^[a-zA-Z0-9/_.-]+$'; then
            echo "unexpected characters in HEAD_REF '${HEAD_REF}' - refusing to use it"
            exit 1
          fi
          if ! echo "${HEAD_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "HEAD_SHA is not a 40-char hex SHA - refusing"
            exit 1
          fi
          if [ -z "${PAT_TOKEN}" ]; then
            echo "PAT_TOKEN is empty - refusing to push"
            exit 1
          fi

          # Snapshot only the files this job is allowed to write (keep in
          # sync with the tag job allowlist below). Generated on the
          # trusted base tree; copied onto Dependabot's commit afterwards.
          SYNC_DIR=$(mktemp -d)
          for path in \
            hack/openshell-pins/Dockerfile \
            api/v1alpha1/openshellgateway_types.go \
            docs.toml \
            README.md
          do
            mkdir -p "${SYNC_DIR}/$(dirname "${path}")"
            cp "${path}" "${SYNC_DIR}/${path}"
          done
          mkdir -p "${SYNC_DIR}/config/crd/bases" "${SYNC_DIR}/bundle/manifests"
          cp -a config/crd/bases/. "${SYNC_DIR}/config/crd/bases/"
          cp -a bundle/manifests/. "${SYNC_DIR}/bundle/manifests/"

          git config --local http.https://github.com/.extraheader "AUTHORIZATION: bearer ${PAT_TOKEN}"
          git fetch --no-recurse-submodules origin "${HEAD_REF}"
          # Disable hooks/smudge filters from the fetched tree; we will not
          # run make or any PR scripts after this point.
          git -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
            checkout --force -B pr-head FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "${HEAD_SHA}" ]; then
            echo "PR branch HEAD $(git rev-parse HEAD) != expected ${HEAD_SHA} - refusing to push"
            exit 1
          fi

          cp "${SYNC_DIR}/hack/openshell-pins/Dockerfile" hack/openshell-pins/Dockerfile
          cp "${SYNC_DIR}/api/v1alpha1/openshellgateway_types.go" api/v1alpha1/openshellgateway_types.go
          cp "${SYNC_DIR}/docs.toml" docs.toml
          cp "${SYNC_DIR}/README.md" README.md
          cp -a "${SYNC_DIR}/config/crd/bases/." config/crd/bases/
          cp -a "${SYNC_DIR}/bundle/manifests/." bundle/manifests/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            hack/openshell-pins/Dockerfile \
            api/v1alpha1/openshellgateway_types.go \
            docs.toml \
            README.md \
            config/crd/bases \
            bundle/manifests
          git diff --cached --quiet && exit 0
          git commit -m "chore(openshell): sync ImageTag default and docs badge to ${NEW_VERSION}"
          # Fast-forward only: if Dependabot pushed again, this fails
          # instead of rewriting their branch.
          git push origin "HEAD:${HEAD_REF}"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check if this was a dependency-only bump
        id: check
        run: |
          # First-parent diff: "what did merging this PR change on main,
          # relative to main immediately before". This is correct for both
          # a squash-merge (single-parent commit, HEAD~1 is just its
          # predecessor) and a normal 2-parent merge commit (HEAD~1 is the
          # first parent, i.e. main before the merge - git's `diff-tree -r`
          # on a bare merge commit shows only conflicting paths by default,
          # not the actual incoming change set, so it's the wrong tool here
          # despite being commonly recommended for "what changed in this
          # commit").
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "${CHANGED}"
          if [ -z "${CHANGED}" ]; then
            echo "dependency_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep this allowlist in sync with the actual files the `sync` job
          # (above) writes - if that job starts touching a new file, add it
          # here too, or a legitimate dependency-only merge will fail this
          # check and silently skip auto-tagging.
          if echo "${CHANGED}" | grep -qvE '^(hack/openshell-pins/.*|api/v1alpha1/openshellgateway_types\.go|config/crd/bases/.*|bundle/manifests/.*|docs\.toml|README\.md)$'; then
            echo "dependency_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "${CHANGED}" | grep -q '^hack/openshell-pins/'; then
            echo "dependency_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dependency_only=true" >> "$GITHUB_OUTPUT"

      - name: Compute and push dependency-bump tag
        if: steps.check.outputs.dependency_only == 'true'
        run: |
          # BASE must be the latest REAL release tag (bare vX.Y.Z, pushed
          # manually per AGENTS.md's tag strategy), NOT Makefile's VERSION -
          # that field is deliberately frozen at its original stub value
          # ("VERSION in Makefile stays as base") and never reflects actual
          # releases. Using it here silently anchored every dependency tag
          # to v0.1.0 forever, regardless of how many real vX.Y.Z releases
          # had since shipped - caught 2026-08-04 before merging a PR that
          # would have produced v0.1.0-<huge number> right after v0.2.4.
          #
          # Check existing tags via the remote, not local `git rev-parse` -
          # this job's checkout has no fetch-depth override for tags, but
          # relying on local refs at all is fragile; ls-remote is always
          # authoritative regardless of what this checkout happened to fetch.
          BASE=$(git ls-remote --tags origin 'refs/tags/v*' \
            | grep -oP 'refs/tags/v\K\d+\.\d+\.\d+$' | sort -V | tail -1)
          if ! echo "${BASE}" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "No real vX.Y.Z release tag found on origin - refusing to guess a base for the dependency-bump tag"
            exit 1
          fi
          ESCAPED_BASE=$(echo "${BASE}" | sed 's/\./\\./g')
          LAST=$(git ls-remote --tags origin "refs/tags/v${BASE}-*" \
            | grep -oP "v${ESCAPED_BASE}-\K\d+" | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          NEW_TAG="v${BASE}-${N}"
          echo "Tagging dependency-only bump: ${NEW_TAG}"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"
