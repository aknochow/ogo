name: Upstream Sync

# Detection of new NVIDIA OpenShell releases is Dependabot's job (see
# .github/dependabot.yml's entry for /hack/openshell-pins) - it opens a PR
# whenever it bumps a tag in hack/openshell-pins/Dockerfile. This workflow
# has two responsibilities:
#
# 1. sync: on that PR, complete the bump by updating the ImageTag
#    kubebuilder default, regenerating CRD manifests, and updating the
#    OpenShell version badge - then push those changes onto the same PR
#    branch so the PR's normal CI (lint/test/e2e) tests the new pin before
#    anyone merges it.
# 2. tag: on merge to main, if the merged commit ONLY touched the
#    dependency-bump files (no other code changes), auto-tag a
#    dependency-only release (vX.Y.Z-N) and push it, which triggers the
#    normal release.yml build pipeline. Deliberate OGO releases (vX.Y.Z)
#    stay a manual, human-triggered action - see AGENTS.md's tag strategy.
#
# Uses pull_request_target (not pull_request) because Dependabot PRs get a
# read-only GITHUB_TOKEN under the normal pull_request trigger. Safe here
# since Dependabot PRs are same-repo (never a fork) and the only action
# taken is a mechanical sync of version strings the PR itself already
# introduced.

on:
  pull_request_target:
    paths:
      - 'hack/openshell-pins/**'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    # Restricted to Dependabot's own actor identity - github.actor cannot be
    # spoofed by a PR author, unlike file contents. Without this, any
    # contributor to this public repo could open a PR touching
    # hack/openshell-pins/** and get this job to check out their branch,
    # run `make manifests` (arbitrary Go tooling) against it, and push the
    # result using PAT_TOKEN's write access.
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Parse and sync the new pinned version
        id: sync
        run: |
          GATEWAY_TAG=$(grep -oP 'openshell/gateway:\K\S+' hack/openshell-pins/Dockerfile)
          SUPERVISOR_TAG=$(grep -oP 'openshell/supervisor:\K\S+' hack/openshell-pins/Dockerfile)
          for TAG in "${GATEWAY_TAG}" "${SUPERVISOR_TAG}"; do
            if ! echo "${TAG}" | grep -qP '^\d+\.\d+\.\d+$'; then
              echo "tag '${TAG}' is not bare semver (X.Y.Z) - refusing to use it in sed/git commands"
              exit 1
            fi
          done
          if [ "${GATEWAY_TAG}" != "${SUPERVISOR_TAG}" ]; then
            echo "gateway (${GATEWAY_TAG}) and supervisor (${SUPERVISOR_TAG}) tags diverged - ImageTag is shared, refusing to guess"
            exit 1
          fi
          NEW_VERSION="${GATEWAY_TAG}"
          OLD_VERSION=$(grep -oP 'OpenShell-v\K[\d.]+' docs.toml | head -1)

          if [ "${NEW_VERSION}" = "${OLD_VERSION}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          sed -i "s/kubebuilder:default=\"${OLD_VERSION}\"/kubebuilder:default=\"${NEW_VERSION}\"/" \
            api/v1alpha1/openshellgateway_types.go
          sed -i "s/OpenShell-v${OLD_VERSION}/OpenShell-v${NEW_VERSION}/g" docs.toml README.md

      - name: Regenerate CRD manifests
        if: steps.sync.outputs.changed == 'true'
        run: make manifests

      - name: Commit and push to PR branch
        if: steps.sync.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.sync.outputs.new_version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! echo "${HEAD_REF}" | grep -qP '^dependabot/'; then
            echo "unexpected head ref '${HEAD_REF}' (expected a dependabot/* branch) - refusing to push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(openshell): sync ImageTag default and docs badge to ${NEW_VERSION}"
          git push --force-with-lease origin "HEAD:${HEAD_REF}"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check if this was a dependency-only bump
        id: check
        run: |
          # git diff-tree (not git diff HEAD~1) lists every file the commit
          # actually changed regardless of merge strategy - git diff HEAD~1
          # HEAD only looks at the first parent, so a merge commit could
          # hide second-parent changes and misclassify a real code change
          # as dependency-only.
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "${CHANGED}"
          if echo "${CHANGED}" | grep -qvE '^(hack/openshell-pins/.*|api/v1alpha1/openshellgateway_types\.go|config/crd/bases/.*|docs\.toml|README\.md)$'; then
            echo "dependency_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "${CHANGED}" | grep -q '^hack/openshell-pins/'; then
            echo "dependency_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dependency_only=true" >> "$GITHUB_OUTPUT"

      - name: Compute and push dependency-bump tag
        if: steps.check.outputs.dependency_only == 'true'
        run: |
          BASE=$(grep -oP 'VERSION \?= \K[\d.]+' Makefile)
          # Check existing tags via the remote, not local `git rev-parse` -
          # this job's checkout has no fetch-depth override for tags, but
          # relying on local refs at all is fragile; ls-remote is always
          # authoritative regardless of what this checkout happened to fetch.
          LAST=$(git ls-remote --tags origin "refs/tags/v${BASE}-*" \
            | grep -oP "v${BASE}-\K\d+" | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          NEW_TAG="v${BASE}-${N}"
          echo "Tagging dependency-only bump: ${NEW_TAG}"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"
